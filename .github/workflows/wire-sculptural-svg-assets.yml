name: Wire stable sculptural assets
on:
  push:
    paths:
      - '.github/workflows/wire-sculptural-svg-assets.yml'
permissions:
  contents: write
jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire distinct stable assets
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('/assets/hero-sculpture-v2.webp','/assets/hero-sculpture.webp')
          s=s.replace('/assets/consult-sculpture-v2.webp','/assets/consult-sculpture.svg')
          s=s.replace('/assets/quality-sculpture-v2.webp','/assets/quality-sculpture.svg')
          s=s.replace('/assets/experts-sculpture-v2.webp','/assets/experts-sculpture.svg')
          s=s.replace('src="/assets/consult-sculpture.svg" width="1448" height="1086"','src="/assets/consult-sculpture.svg" width="1200" height="900"')
          s=s.replace('src="/assets/quality-sculpture.svg" width="1448" height="1086"','src="/assets/quality-sculpture.svg" width="1200" height="900"')
          s=s.replace('src="/assets/experts-sculpture.svg" width="1448" height="1086"','src="/assets/experts-sculpture.svg" width="1200" height="900"')
          p.write_text(s)
          PY
      - name: Commit
        run: |
          git config user.name "A+ Esthetic Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use distinct stable sculptural visuals"
          git push
