name: Sync exact Skinbooster Gesicht landing

on:
  push:
    paths:
      - '.github/workflows/sync-skinbooster-gesicht.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live production source
        run: |
          curl -A 'Mozilla/5.0' -L --fail --retry 3 --connect-timeout 20 \
            'https://a-esthetic.de/skinbooster/gesicht-frankfurt/' \
            -o /tmp/source.html

      - name: Build new-design page without changing production copy
        run: |
          python - <<'PY'
          import re, html as h
          from pathlib import Path

          source = Path('/tmp/source.html').read_text(encoding='utf-8', errors='replace')
          url = 'https://a-esthetic.de/skinbooster/gesicht-frankfurt/'

          def one(pattern, default='', flags=re.I|re.S):
              m = re.search(pattern, source, flags)
              return m.group(1).strip() if m else default

          title = one(r'<title[^>]*>(.*?)</title>', 'Skinbooster Gesicht Frankfurt | ab 250 € | A+ Esthetic')
          title = re.sub(r'<[^>]+>', '', title)
          desc = one(r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']', '')
          if not desc:
              desc = one(r'<meta[^>]+content=["\'](.*?)["\'][^>]+name=["\']description["\']', '')

          m = re.search(r'(<main\s+class=["\']sbg-page["\'][^>]*>.*?</main>)', source, re.I|re.S)
          if not m:
              raise SystemExit('Could not find exact sbg-page main content in production HTML')
          main = m.group(1)

          style_blocks = []
          for sm in re.finditer(r'<style[^>]*>(.*?)</style>', source, re.I|re.S):
              css_block = sm.group(1)
              if '.sbg-page' in css_block:
                  style_blocks.append(css_block)
          if not style_blocks:
              raise SystemExit('Could not find Skinbooster page CSS in production HTML')

          css = '\n'.join(style_blocks)
          extra_css = r'''
          :root{--site-ink:#17120e;--site-paper:#f4eee5;--site-gold:#c0924f;--site-serif:"Bodoni 72","Didot","Iowan Old Style","Times New Roman",serif;--site-sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
          *{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--site-paper);color:var(--site-ink);font-family:var(--site-sans);overflow-x:hidden}a{color:inherit;text-decoration:none}
          .site-header{position:absolute;z-index:50;left:0;right:0;top:0;height:90px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4.5vw;color:#fff;border-bottom:1px solid rgba(255,255,255,.14)}
          .site-brand{font:400 24px var(--site-serif)}.site-brand small{display:block;font:600 8px/1.2 var(--site-sans);letter-spacing:.3em;text-transform:uppercase;margin-top:5px;color:rgba(255,255,255,.62)}
          .site-nav{display:flex;gap:28px;font-size:9px;letter-spacing:.17em;text-transform:uppercase}.site-nav a{color:rgba(255,255,255,.72)}
          .site-cta{justify-self:end;border:1px solid rgba(255,255,255,.44);padding:11px 17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#fff}
          .site-footer{background:#0b0907;color:rgba(255,255,255,.58);padding:36px 0}.site-footer-grid{width:min(1280px,calc(100% - 52px));margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}.site-footer h3{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#fff}.site-footer p,.site-footer a{font-size:11px;line-height:1.8}
          .sbg-page{--sb-gold:#c0924f;--sb-gold-dark:#9e753d;--sb-gold-soft:#e1bd78;--sb-cream:#fbf7f0;--sb-cream-dark:#f4eee5}
          .sbg-page .sbg-hero{min-height:100svh;background:radial-gradient(circle at 78% 18%,rgba(219,184,123,.28),transparent 27%),linear-gradient(120deg,#17120e 0%,#2a211b 54%,#766043 100%)}
          .sbg-page .sbg-hero:before,.sbg-page .sbg-hero:after{display:none}
          .sbg-page .sbg-hero-inner{padding-top:132px}
          .sbg-page h1,.sbg-page h2,.sbg-page h3,.sbg-page .sbg-price strong{font-family:var(--site-serif);font-weight:400}
          .sbg-page .sbg-card,.sbg-page .sbg-goal,.sbg-page .sbg-difference-card,.sbg-page .sbg-list-card,.sbg-page .sbg-product-main,.sbg-page .sbg-product-side,.sbg-page .sbg-notice,.sbg-page .sbg-step,.sbg-page .sbg-result,.sbg-page .sbg-price-shell,.sbg-page .sbg-price,.sbg-page .sbg-faq details,.sbg-page .sbg-related-card,.sbg-page .sbg-anchor{border-radius:0;box-shadow:none}
          .sbg-page .sbg-anchor-wrap{background:#15110e;margin-top:0}.sbg-page .sbg-anchor{border:0;background:#15110e;padding:0}.sbg-page .sbg-anchor a{color:rgba(255,255,255,.67)!important;padding:17px 13px;border-radius:0;font-size:9px;letter-spacing:.1em;text-transform:uppercase}
          .sbg-page .sbg-section{padding:94px 0}.sbg-page .sbg-heading h2,.sbg-page .sbg-copy h2{font-size:clamp(42px,4.6vw,68px);text-transform:uppercase;line-height:.97}
          @media(max-width:1000px){.site-header{grid-template-columns:1fr auto}.site-nav{display:none}.site-footer-grid{grid-template-columns:1fr 1fr}}
          @media(max-width:700px){.site-header{height:72px;padding:0 18px}.site-footer-grid{width:min(100% - 28px,1280px);grid-template-columns:1fr}.sbg-page .sbg-hero{min-height:820px}.sbg-page .sbg-hero-inner{padding:360px 0 62px}.sbg-page .sbg-section{padding:68px 0}}
          '''
          css += extra_css
          Path('assets/sbg-treatment.css').write_text(css, encoding='utf-8')

          schemas = []
          for sm in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>.*?</script>', source, re.I|re.S):
              block = sm.group(0)
              if 'skinbooster/gesicht-frankfurt' in block or 'FAQPage' in block:
                  schemas.append(block)

          header = '''<header class="site-header"><a class="site-brand" href="/">A+ Esthetic<small>Frankfurt</small></a><nav class="site-nav"><a href="/behandlungen/">Behandlungen</a><a href="/skinbooster/">Skinbooster</a><a href="#faq">FAQ</a></nav><a class="site-cta" href="https://www.doctolib.de/privatpraxis/frankfurt-am-main/a-esthetic-zentrum-fuer-aesthetik" target="_blank" rel="noopener">Termin buchen</a></header>'''
          footer = '''<footer class="site-footer"><div class="site-footer-grid"><div><h3>A+ Esthetic</h3><p>Stiftstrasse 14<br>60313 Frankfurt am Main<br>2. OG</p></div><div><h3>Behandlungen</h3><p><a href="/skinbooster/">Skinbooster</a><br><a href="/behandlungen/">Alle Behandlungen</a></p></div><div><h3>Kontakt</h3><p>069-71417012<br>+49 172 9907936<br>Info@a-esthetic.de</p></div><div><h3>Rechtliches</h3><p><a href="/impressum/">Impressum</a><br><a href="/datenschutzerklaerung/">Datenschutz</a></p></div></div></footer>'''

          meta_desc = f'<meta name="description" content="{h.escape(desc, quote=True)}">' if desc else ''
          out = f'''<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{h.escape(title)}</title>{meta_desc}<meta name="robots" content="noindex,nofollow"><link rel="canonical" href="{url}"><meta name="theme-color" content="#17120e"><link rel="stylesheet" href="/assets/sbg-treatment.css">{''.join(schemas)}</head><body>{header}{main}{footer}</body></html>'''

          dest = Path('skinbooster/gesicht-frankfurt/index.html')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(out, encoding='utf-8')

          required = [
              'Skinbooster fürs Gesicht in Frankfurt',
              'Neauvia Skinbooster',
              'Auch ein Skinbooster ist eine Filler-Injektion',
              'Warnzeichen sofort melden',
              'ab 250 €',
              'Fragen zum Skinbooster fürs Gesicht',
              'Gefäßverschluss mit Hautschädigung oder Nekrose'
          ]
          missing = [x for x in required if x not in out]
          if missing:
              raise SystemExit('Missing required exact production strings: ' + repr(missing))
          PY

      - name: Mark audit complete
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('SEO-CONTENT-AUDIT.md')
          s = p.read_text(encoding='utf-8')
          s = s.replace('- `/skinbooster/gesicht-frankfurt/` — MISSING SOURCE', '- `/skinbooster/gesicht-frankfurt/` — PASS — rebuilt from exact live production main content with live SEO title/meta and schema preserved')
          s = s.replace('## Exact-source blockers remaining: 1\n\n1. `/skinbooster/gesicht-frankfurt/`\n\nThis route is a real production route, but the exact full child-page source has not yet been supplied/audited. It must remain unbuilt until exact source copy is available. This is deliberate to protect content parity and SEO.\n\n', '## Exact-source blockers remaining: 0\n\nAll previously missing child-page sources have now been supplied/audited and rebuilt on staging.\n\n')
          s = s.replace('1. Obtain exact production source for `/skinbooster/gesicht-frankfurt/` and build it in the same new design without paraphrasing.\n2. Clean Homepage staging-only absolute internal links so they route through staging while preserving the same semantic destinations.\n3. Re-check title, description, canonical, robots, heading hierarchy, FAQ/schema and prices for every route.\n4. Run a complete internal-link and HTTP-status crawl on staging.\n5. Preserve required 301 redirects, including `/laserbehandlungen/` → `/laser-behandlungen/`.\n6. Only after 100% parity, transfer the approved new design and exact text corpus to WordPress.', '1. Clean Homepage staging-only absolute internal links so they route through staging while preserving the same semantic destinations.\n2. Re-check title, description, canonical, robots, heading hierarchy, FAQ/schema and prices for every route.\n3. Run a complete internal-link and HTTP-status crawl on staging.\n4. Preserve required 301 redirects, including `/laserbehandlungen/` → `/laser-behandlungen/`.\n5. Only after 100% parity, transfer the approved new design and exact text corpus to WordPress.')
          p.write_text(s, encoding='utf-8')
          PY

      - name: Commit generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/sbg-treatment.css skinbooster/gesicht-frankfurt/index.html SEO-CONTENT-AUDIT.md
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Finalize Skinbooster Gesicht exact-copy page'
            git push
          fi
