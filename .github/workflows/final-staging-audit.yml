name: Final staging cleanup and audit

on:
  push:
    paths:
      - '.github/workflows/final-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run cleanup and repository crawl
        run: python tools/final_staging_audit.py

      - name: Commit cleanup and audit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'No changes to commit.'
          else
            git commit -m 'Finalize staging links redirects and crawl audit'
            git push
          fi
