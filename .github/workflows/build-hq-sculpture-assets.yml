name: Build HQ sculpture assets

on:
  push:
    paths:
      - '.github/workflows/build-hq-sculpture-assets.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Rebuild real WebP assets
        shell: bash
        run: |
          set -euo pipefail
          cat .asset-build/hero-sculpture.webp.part* | base64 -d > assets/hero-sculpture.webp
          cp assets/hero-sculpture.webp assets/consult-sculpture.webp
          cp assets/hero-sculpture.webp assets/experts-sculpture.webp
          python - <<'PY'
          from pathlib import Path
          for f in ['assets/hero-sculpture.webp','assets/consult-sculpture.webp','assets/experts-sculpture.webp']:
              b=Path(f).read_bytes()
              assert len(b) > 20000, (f,len(b))
              assert b[:4] == b'RIFF' and b[8:12] == b'WEBP', (f,b[:12])
              print(f, len(b), b[:12])
          PY
      - name: Clean staging files and commit
        shell: bash
        run: |
          rm -rf .asset-build
          rm -f .github/workflows/build-hq-sculpture-assets.yml
          git config user.name "A+ Esthetic Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add -A
          git commit -m "Fix real HQ sculptural imagery"
          git push
