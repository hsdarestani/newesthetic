name: Apply Sculptural Hero

on:
  push:
    paths:
      - '.github/workflows/apply-sculptural-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire high-quality sculptural images
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Hero: real 1672x941 WebP generated for this landing page.
          s = s.replace('src="/assets/hero-final.svg" width="1200" height="675" alt="Sculptural Aesthetic Visual für A+ Esthetic Frankfurt"',
                        'src="/assets/hero-sculpture.webp" width="1672" height="941" alt="Sculptural Aesthetic Visual für A+ Esthetic Frankfurt"')

          # Consultation and experts use separate real high-resolution generated WebPs.
          s = s.replace('<div class="consult-photo"><img src="/assets/hero-final.svg" width="1400" height="933"',
                        '<div class="consult-photo"><img src="/assets/consult-sculpture.webp" width="1448" height="1086"')
          s = s.replace('<div class="experts-img"><img src="/assets/hero-final.svg" width="1400" height="933"',
                        '<div class="experts-img"><img src="/assets/experts-sculpture.webp" width="1448" height="1086"')

          # Fine-tune crops without touching any SEO text or links.
          visual_css = '.hero-media{object-position:center center}.consult-photo img{object-position:center center}.experts-img img{object-position:center center}'
          if visual_css not in s:
              s = s.replace('</style>', visual_css + '</style>', 1)

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "A+ Esthetic Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use real high-quality sculptural WebP imagery"
          git push
