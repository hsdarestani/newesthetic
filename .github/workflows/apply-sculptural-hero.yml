name: Apply Sculptural Hero

on:
  push:
    paths:
      - '.github/workflows/apply-sculptural-hero.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch landing page hero
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          s = s.replace('src="/assets/hero.svg" width="1600" height="900"', 'src="/assets/hero-final.svg" width="1200" height="675"')
          s = s.replace('src="/assets/feature.svg"', 'src="/assets/hero-final.svg"')
          s = s.replace('src="/assets/skin.svg"', 'src="/assets/hero-final.svg"')
          s = s.replace('Ästhetik.<br>Neu geformt.', 'Form.<br>Harmonie.<br>Perfektion.')

          s = re.sub(r'\.header\{[^}]*\}', '.header{position:absolute;z-index:20;top:0;left:0;right:0;height:88px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4vw;color:#fff;border-bottom:1px solid rgba(255,255,255,.28);text-shadow:0 1px 14px rgba(50,31,15,.16)}', s, count=1)
          s = re.sub(r'\.header-cta\{[^}]*\}', '.header-cta{justify-self:end;padding:12px 18px;border:1px solid rgba(255,255,255,.55);font-size:10px;letter-spacing:.15em;text-transform:uppercase;background:rgba(255,255,255,.06);backdrop-filter:blur(8px);color:#fff}', s, count=1)

          hero_css = '.hero{position:relative;min-height:100svh;background:#a78b6e;overflow:hidden}.hero-media{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center}.hero-shade{position:absolute;inset:0;background:linear-gradient(90deg,rgba(65,43,26,.30) 0%,rgba(75,49,28,.17) 34%,rgba(31,21,15,.02) 64%,rgba(31,21,15,.02) 100%)}.hero-copy{position:relative;z-index:3;min-height:100svh;display:flex;flex-direction:column;justify-content:center;width:min(560px,43vw);padding:120px 0 145px;margin-left:5vw;color:#fff;text-shadow:0 3px 24px rgba(63,39,20,.16)}.display-title{font:400 clamp(66px,6.9vw,108px)/.9 var(--serif);letter-spacing:-.055em;margin:15px 0 18px}.hero h4{font:400 clamp(20px,2vw,29px)/1.18 var(--serif);margin:0 0 18px;max-width:530px;color:#fff}.hero-copy p{max-width:500px;color:rgba(255,255,255,.84);font-size:14px;line-height:1.72;margin:0 0 12px}'
          s = re.sub(r'\.hero\{.*?\.hero-copy p\{[^}]*\}', hero_css, s, count=1, flags=re.S)

          rail_css = '.hero-rail{position:absolute;z-index:5;left:0;right:0;bottom:0;display:grid;grid-template-columns:repeat(8,1fr);background:rgba(71,52,36,.48);backdrop-filter:blur(14px);border-top:1px solid rgba(255,255,255,.26);box-shadow:none;color:#fff}.hero-rail a{padding:18px 8px;text-align:center;border-right:1px solid rgba(255,255,255,.18);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:#fff}.hero-rail a:last-child{border-right:0}.hero-rail a:hover{background:rgba(255,255,255,.10)}'
          s = re.sub(r'\.hero-rail\{.*?\.hero-rail a:hover\{[^}]*\}', rail_css, s, count=1, flags=re.S)

          # keep SEO text/links; only make hero CTA match the promised composition
          s = s.replace('<a class="btn primary" href="https://www.doctolib.de/privatpraxis/frankfurt-am-main/a-esthetic-zentrum-fuer-aesthetik" target="_blank" rel="noreferrer">Termin buchen</a><a class="btn" href="#behandlungen">Behandlungen im Überblick</a>', '<a class="btn primary" href="https://www.doctolib.de/privatpraxis/frankfurt-am-main/a-esthetic-zentrum-fuer-aesthetik" target="_blank" rel="noreferrer">Termin vereinbaren</a>')

          # mobile composition: image first, copy over lower part, no white split block
          s = s.replace('.hero-shade{background:linear-gradient(180deg,rgba(249,244,237,.7) 0%,rgba(249,244,237,.32) 34%,rgba(249,244,237,.96) 65%,rgba(249,244,237,1) 100%)}', '.hero-shade{background:linear-gradient(180deg,rgba(35,24,16,.02) 0%,rgba(35,24,16,.05) 40%,rgba(35,24,16,.48) 70%,rgba(35,24,16,.68) 100%)}')
          s = s.replace('.hero-copy{width:auto;margin:0;padding:450px 18px 170px;justify-content:flex-end}', '.hero-copy{width:auto;margin:0;padding:430px 18px 170px;justify-content:flex-end;color:#fff}')

          p.write_text(s)
          PY
      - name: Commit patch
        run: |
          git config user.name "A+ Esthetic Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Match promised sculptural hero composition"
          git push
