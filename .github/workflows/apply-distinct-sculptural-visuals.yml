name: Apply distinct sculptural visuals

on:
  push:
    paths:
      - '.github/workflows/apply-distinct-sculptural-visuals.yml'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Wire four distinct sculpture images
        run: |
          python - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          # Only visual sources change; SEO copy and links stay untouched.
          s = s.replace('/assets/hero-sculpture.webp', '/assets/hero-sculpture-v2.webp')
          s = s.replace('/assets/consult-sculpture.webp', '/assets/consult-sculpture-v2.webp')
          s = s.replace('/assets/experts-sculpture.webp', '/assets/experts-sculpture-v2.webp')

          # Add a fourth, different sculptural visual to the quality section.
          if '.quality-visual{' not in s:
              s = s.replace(
                  '.quality{background:#f4ece2;padding:100px 0}',
                  '.quality{background:#f4ece2;padding:100px 0}.quality-visual{height:clamp(320px,42vw,560px);overflow:hidden;margin:0 0 38px;border:1px solid var(--line)}.quality-visual img{width:100%;height:100%;object-fit:cover;object-position:center}'
              )

          needle = '<div style="font:400 34px/1 var(--serif);margin:-25px 0 38px">Qualität <span style="color:var(--gold)">vs.</span> Günstig</div><div class="compare">'
          if '/assets/quality-sculpture-v2.webp' not in s:
              replacement = '<div style="font:400 34px/1 var(--serif);margin:-25px 0 38px">Qualität <span style="color:var(--gold)">vs.</span> Günstig</div><div class="quality-visual reveal"><img src="/assets/quality-sculpture-v2.webp" width="1448" height="1086" alt="Sculptural Visual für Qualität und Präzision" loading="lazy" decoding="async"></div><div class="compare">'
              if needle not in s:
                  raise SystemExit('quality insertion point not found')
              s = s.replace(needle, replacement, 1)

          p.write_text(s)
          PY
      - name: Commit landing update
        run: |
          git config user.name "A+ Esthetic Design Bot"
          git config user.email "actions@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet || git commit -m "Use four distinct sculptural visuals"
          git push
