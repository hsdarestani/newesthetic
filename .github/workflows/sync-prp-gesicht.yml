name: Sync exact PRP Gesicht landing

on:
  push:
    paths:
      - '.github/workflows/sync-prp-gesicht.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Fetch live production source
        run: |
          curl -A 'Mozilla/5.0' -L --fail --retry 3 --connect-timeout 20 \
            'https://a-esthetic.de/prp-behandlung/gesicht-frankfurt/' \
            -o /tmp/source.html

      - name: Build new-design page without changing production copy
        run: |
          python - <<'PY'
          import re, html as h
          from pathlib import Path

          source = Path('/tmp/source.html').read_text(encoding='utf-8', errors='replace')
          url = 'https://a-esthetic.de/prp-behandlung/gesicht-frankfurt/'

          def one(pattern, default='', flags=re.I|re.S):
              m = re.search(pattern, source, flags)
              return m.group(1).strip() if m else default

          title = one(r'<title[^>]*>(.*?)</title>', 'PRP Gesicht Frankfurt | Eigenblut ab 350 €')
          title = re.sub(r'<[^>]+>', '', title)
          desc = one(r'<meta[^>]+name=["\']description["\'][^>]+content=["\'](.*?)["\']', '')
          if not desc:
              desc = one(r'<meta[^>]+content=["\'](.*?)["\'][^>]+name=["\']description["\']', '')

          m = re.search(r'(<main\s+class=["\']prpf["\'][^>]*>.*?</main>)', source, re.I|re.S)
          if not m:
              raise SystemExit('Could not find exact prpf main content in production HTML')
          main = m.group(1)

          style_blocks = []
          for sm in re.finditer(r'<style[^>]*>(.*?)</style>', source, re.I|re.S):
              css_block = sm.group(1)
              if '.prpf' in css_block:
                  style_blocks.append(css_block)
          if not style_blocks:
              raise SystemExit('Could not find PRP page CSS in production HTML')

          css = '\n'.join(style_blocks)
          css += r'''
:root{--site-ink:#17120e;--site-paper:#f4eee5;--site-gold:#c0924f;--site-serif:"Bodoni 72","Didot","Iowan Old Style","Times New Roman",serif;--site-sans:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--site-paper);color:var(--site-ink);font-family:var(--site-sans);overflow-x:hidden}a{color:inherit;text-decoration:none}
.site-header{position:absolute;z-index:50;left:0;right:0;top:0;height:90px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 4.5vw;color:#fff;border-bottom:1px solid rgba(255,255,255,.14)}
.site-brand{font:400 24px var(--site-serif)}.site-brand small{display:block;font:600 8px/1.2 var(--site-sans);letter-spacing:.3em;text-transform:uppercase;margin-top:5px;color:rgba(255,255,255,.62)}
.site-nav{display:flex;gap:28px;font-size:9px;letter-spacing:.17em;text-transform:uppercase}.site-nav a{color:rgba(255,255,255,.72)}
.site-cta{justify-self:end;border:1px solid rgba(255,255,255,.44);padding:11px 17px;font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#fff}
.site-footer{background:#0b0907;color:rgba(255,255,255,.58);padding:36px 0}.site-footer-grid{width:min(1280px,calc(100% - 52px));margin:auto;display:grid;grid-template-columns:2fr 1fr 1fr 1fr;gap:28px}.site-footer h3{font-size:9px;letter-spacing:.15em;text-transform:uppercase;color:#fff}.site-footer p,.site-footer a{font-size:11px;line-height:1.8}
.prpf .hero{background:linear-gradient(90deg,rgba(12,9,7,.96) 0 31%,rgba(12,9,7,.72) 46%,rgba(12,9,7,.18) 76%,rgba(12,9,7,.26) 100%),url('/assets/prp.png') center/cover no-repeat #15110e}
.prpf .hero:before{display:none}.prpf .hero-in{padding-top:132px}.prpf h1,.prpf h2,.prpf h3,.prpf .price strong{font-family:var(--site-serif)}
@media(max-width:1000px){.site-header{grid-template-columns:1fr auto}.site-nav{display:none}.site-footer-grid{grid-template-columns:1fr 1fr}}
@media(max-width:700px){.site-header{height:72px;padding:0 18px}.site-footer-grid{width:min(100% - 28px,1280px);grid-template-columns:1fr}.prpf .hero{min-height:880px;background-position:66% center}.prpf .hero:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(12,9,7,.08) 0 34%,rgba(12,9,7,.73) 63%,rgba(12,9,7,.98) 100%)}.prpf .hero-in{z-index:2;padding:390px 0 62px}}
'''
          Path('assets/prpf-treatment.css').write_text(css, encoding='utf-8')

          schemas = []
          for sm in re.finditer(r'<script[^>]+type=["\']application/ld\+json["\'][^>]*>.*?</script>', source, re.I|re.S):
              block = sm.group(0)
              if 'prp-behandlung/gesicht-frankfurt' in block or 'FAQPage' in block:
                  schemas.append(block)

          header = '''<header class="site-header"><a class="site-brand" href="/">A+ Esthetic<small>Frankfurt</small></a><nav class="site-nav"><a href="/behandlungen/">Behandlungen</a><a href="/prp-behandlung/">PRP</a><a href="#faq">FAQ</a></nav><a class="site-cta" href="https://www.doctolib.de/privatpraxis/frankfurt-am-main/a-esthetic-zentrum-fuer-aesthetik" target="_blank" rel="noopener">Termin buchen</a></header>'''
          footer = '''<footer class="site-footer"><div class="site-footer-grid"><div><h3>A+ Esthetic</h3><p>Stiftstrasse 14<br>60313 Frankfurt am Main<br>2. OG</p></div><div><h3>Behandlungen</h3><p><a href="/prp-behandlung/">PRP-Behandlung</a><br><a href="/behandlungen/">Alle Behandlungen</a></p></div><div><h3>Kontakt</h3><p>069-71417012<br>+49 172 9907936<br>Info@a-esthetic.de</p></div><div><h3>Rechtliches</h3><p><a href="/impressum/">Impressum</a><br><a href="/datenschutzerklaerung/">Datenschutz</a></p></div></div></footer>'''

          out = f'''<!doctype html><html lang="de"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>{h.escape(title)}</title>{f'<meta name="description" content="{h.escape(desc, quote=True)}">' if desc else ''}<meta name="robots" content="noindex,nofollow"><link rel="canonical" href="{url}"><meta name="theme-color" content="#17120e"><link rel="stylesheet" href="/assets/prpf-treatment.css">{''.join(schemas)}</head><body>{header}{main}{footer}</body></html>'''

          dest = Path('prp-behandlung/gesicht-frankfurt/index.html')
          dest.parent.mkdir(parents=True, exist_ok=True)
          dest.write_text(out, encoding='utf-8')

          required = [
              'PRP-Behandlung fürs Gesicht in Frankfurt',
              'PRP ist nicht automatisch immer gleich zusammengesetzt',
              'Augenbereich ist keine risikofreie Zone',
              'Warnzeichen sofort medizinisch abklären',
              'ab 350 €',
              'ab 1800 €',
              'ab 2500 €',
              'Fragen zur PRP-Behandlung fürs Gesicht'
          ]
          missing = [x for x in required if x not in out]
          if missing:
              raise SystemExit('Missing required exact production strings: ' + repr(missing))
          PY

      - name: Commit generated page
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets/prpf-treatment.css prp-behandlung/gesicht-frankfurt/index.html
          if git diff --cached --quiet; then
            echo 'No generated changes.'
          else
            git commit -m 'Build PRP Gesicht page from exact production copy'
            git push
          fi
