name: Live staging audit

on:
  push:
    paths:
      - '.github/workflows/live-staging-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  live-audit:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Audit deployed Cloudflare staging
        run: python tools/live_staging_audit.py

      - name: Commit live audit report
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add LIVE-STAGING-AUDIT.md
          if git diff --cached --quiet; then
            echo 'No report changes.'
          else
            git commit -m 'Record live staging audit'
            git push
          fi

      - name: Enforce live audit pass
        run: |
          test "$(tr -d '\r\n' < .live-audit-status)" = "PASS"
